name: Deploy Inspector Standalone to GitHub Pages

on:
  push:
    branches:
      - fork/inspector-standalone
      - fork/main
      - main
    paths:
      - "libraries/typescript/packages/inspector/**"
      - "libraries/typescript/packages/client/**"
      - "libraries/typescript/packages/agent/**"
      - ".github/workflows/deploy-inspector-pages.yml"
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: libraries/typescript/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: libraries/typescript
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build internal packages (@mcp-use/client, @mcp-use/agent)
        working-directory: libraries/typescript
        run: |
          pnpm --filter @mcp-use/client build
          pnpm --filter @mcp-use/agent build

      - name: Build standalone Inspector web bundle
        working-directory: libraries/typescript
        run: pnpm --filter @mcp-use/inspector exec vite build --config vite.config.ts --base ./

      - name: Prepare GitHub Pages artifacts
        run: |
          mkdir -p _site/inspector
          # Copy to root
          cp -r libraries/typescript/packages/inspector/dist/web/* _site/
          # Copy to /inspector subdirectory for backwards compatibility
          cp -r libraries/typescript/packages/inspector/dist/web/* _site/inspector/
          # Create 404.html for SPA client-side routing on GitHub Pages
          cp _site/index.html _site/404.html
          cp _site/index.html _site/inspector/404.html
          # Prevent Jekyll processing
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
