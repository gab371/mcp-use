# GitLab CI configuration for deploying MCP Inspector Standalone to GitLab Pages

stages:
  - deploy

variables:
  MCP_USE_ANONYMIZED_TELEMETRY: "false"

pages:
  stage: deploy
  image: node:24-bookworm
  cache:
    key:
      files:
        - libraries/typescript/pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate || npm install -g pnpm
    - export PNPM_HOME="$CI_PROJECT_DIR/.pnpm"
    - export PATH="$PNPM_HOME:$PATH"
    - pnpm config set store-dir .pnpm-store
  script:
    - cd libraries/typescript
    - pnpm install --no-frozen-lockfile
    - pnpm --filter @mcp-use/client build
    - pnpm --filter @mcp-use/agent build
    - MCP_USE_ANONYMIZED_TELEMETRY=false pnpm --filter @mcp-use/inspector exec vite build --config vite.config.ts --base ./
    # The Vite build already bundles .evals/suites and generates evals/suites.json
    # (see forkStaticEvalsPlugin) so the static site is self-contained.
    - cd ../..
    - node scripts/fork/generate-gitlab-pages.mjs
  artifacts:
    paths:
      - public
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_BRANCH == "fork/main"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
