ServerName localhost

# Serve root
<Directory "/usr/local/apache2/htdocs">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

# SPA fallback routing for /inspector
<Directory "/usr/local/apache2/htdocs/inspector">
    Options Indexes FollowSymLinks
    AllowOverride All
    Require all granted
    FallbackResource /inspector/index.html
</Directory>
